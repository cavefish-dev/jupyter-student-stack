[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-kernel"
version = "0.1.0"
description = "Step-by-step x86-64 assembly (NASM) Jupyter kernel for students, emulated with Unicorn"
requires-python = ">=3.9"
dependencies = ["ipykernel", "unicorn>=2"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["asm_kernel"]
